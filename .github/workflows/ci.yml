name: DSA Java CI

# Runs on every push and every pull request to main or dev.
# Babu's repo default branch is dev, so dev must trigger CI too —
# otherwise a push to dev would show no CI run at all.
# Green CI = every lesson compiles and runs clean.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile and run every lesson
        run: |
          set -e
          for dir in lesson*/; do
            echo "=== $dir ==="
            (cd "$dir" && javac Main.java && java Main)
          done
          echo "All lessons compiled and ran clean."
